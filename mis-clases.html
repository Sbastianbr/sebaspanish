<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src https://vvvugnkvtkcfuwxroies.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'" />
  <title>SebaSpanish · Mis clases</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=20260927-i18n" />
  <link rel="stylesheet" href="portal.css?v=20260929-2c" />
  <script src="vendor/supabase-js-2.117.2.js" defer></script>
  <script src="script.js?v=20260927-i18n" defer></script>
  <script src="portal.js" type="module"></script>
</head>
<body class="portal-page" data-portal-page="home">
<a class="portal-skip" href="#portal-main" data-portal-i18n="skip">Ir al contenido</a>
    <header class="navbar">
      <div class="navbar__container">
        <!-- Logo -->
        <a
          class="navbar__brand"
          href="index.html#inicio"
          aria-label="SebaSpanish - Inicio"
          data-i18n-aria="home_label"
        >
          <img class="navbar__logo" src="images/logo.svg" alt="SebaSpanish" />
        </a>

        <!-- Navegación principal -->
        <nav
          class="navbar__menu"
          aria-label="Navegación principal"
          data-i18n-aria="nav_label"
        >
          <a
            class="navbar__link"
            href="index.html#clases"
            data-i18n="nav_classes"
          >
            Clases
          </a>

          <a
            class="navbar__link"
            href="index.html#planes"
            data-section="planes"
            data-i18n="nav_plans"
          >
            Planes
          </a>

          <a
            class="navbar__link"
            href="index.html#opiniones"
            data-section="opiniones"
            data-i18n="nav_reviews"
          >
            Opiniones
          </a>

          <a class="navbar__link" href="index.html#faq" data-i18n="nav_faq"
            >Preguntas</a
          >

          <a
            class="navbar__link"
            href="index.html#tarjeta-seba"
            data-section="tarjeta-seba"
            data-i18n="nav_about"
          >
            Conoce a Seba
          </a>
        </nav>

        <!-- Acciones -->
        <div class="navbar__actions">
          <div class="navbar__language" id="languageSelector">
            <button
              class="navbar__language-button"
              id="languageButton"
              type="button"
              aria-haspopup="menu"
              aria-controls="languageMenu"
              aria-expanded="false"
              aria-label="Seleccionar idioma"
              data-i18n-aria="language_label"
            >
              <svg class="navbar__globe" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M3 12h18"></path>
                <path d="M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9"></path>
                <path d="M12 3C9.5 5.5 8.2 8.5 8.2 12s1.3 6.5 3.8 9"></path>
              </svg>

              <span class="navbar__language-code" id="currentLanguage">
                ES
              </span>

              <svg
                class="navbar__language-arrow"
                viewBox="0 0 20 20"
                aria-hidden="true"
              >
                <path d="M6 8l4 4 4-4"></path>
              </svg>
            </button>

            <div
              class="navbar__language-menu"
              id="languageMenu"
              role="menu"
              aria-labelledby="languageButton"
              inert
            >
              <button
                class="navbar__language-option is-active"
                type="button"
                data-language="es"
                lang="es"
                data-code="ES"
                role="menuitemradio"
                aria-checked="true"
                tabindex="-1"
              >
                <span class="navbar__language-name">Español</span>
                <span class="navbar__language-check" aria-hidden="true">✓</span>
              </button>

              <button
                class="navbar__language-option"
                type="button"
                data-language="en"
                lang="en"
                data-code="EN"
                role="menuitemradio"
                aria-checked="false"
                tabindex="-1"
              >
                <span class="navbar__language-name">English</span>
                <span class="navbar__language-check" aria-hidden="true">✓</span>
              </button>

              <button
                class="navbar__language-option"
                type="button"
                data-language="pl"
                lang="pl"
                data-code="PL"
                role="menuitemradio"
                aria-checked="false"
                tabindex="-1"
              >
                <span class="navbar__language-name">Polski</span>
                <span class="navbar__language-check" aria-hidden="true">✓</span>
              </button>
            </div>
          </div>
          <button class="navbar__cta" id="portal-logout" type="button" data-portal-i18n="logout" hidden>Cerrar sesión</button>
        </div>
      </div>
    </header>
<main class="portal" id="portal-main" tabindex="-1">
  <p class="portal-status" id="portal-status" role="status" aria-live="polite" data-portal-i18n="loading">Comprobando tu acceso…</p>
  <button class="portal-button portal-button--quiet" id="portal-retry" type="button" data-portal-i18n="retry" hidden>Reintentar</button>
  <div id="portal-content" hidden>
    <p class="portal-eyebrow" data-portal-i18n="page">Mis clases</p>
    <h1 id="portal-greeting"></h1>
    <p class="portal-intro" data-portal-i18n="intro">Aquí tienes tus clases y el recorrido que llevas contigo.</p>
    <section class="portal-credits" aria-labelledby="credits-title">
      <h2 id="credits-title" data-portal-i18n="credits">Mis créditos</h2>
      <dl class="portal-stats">
        <div class="portal-stat"><dt data-portal-i18n="available">Disponibles</dt><dd id="credits-available"></dd></div>
        <div class="portal-stat"><dt data-portal-i18n="reserved">Reservados</dt><dd id="credits-reserved"></dd></div>
        <div class="portal-stat"><dt data-portal-i18n="consumed">Consumidos</dt><dd id="credits-consumed"></dd></div>
        <div class="portal-stat"><dt data-portal-i18n="expiredCredits">Vencidos</dt><dd id="credits-expired"></dd></div>
      </dl>
      <p class="portal-note portal-expiry" id="portal-expiry"></p>
      <p class="portal-note" id="portal-review" hidden></p>
    </section>
    <div class="portal-columns">
      <div class="portal-stack">
        <section class="portal-panel" aria-labelledby="upcoming-title">
          <h2 id="upcoming-title" data-portal-i18n="upcoming">Próximas clases</h2>
          <p class="portal-note" id="portal-timezone"></p>
          <ul class="portal-list" id="portal-upcoming"></ul>
          <p class="portal-note" id="empty-upcoming" data-portal-i18n="emptyUpcoming" hidden></p>
        </section>
        <section class="portal-panel" aria-labelledby="history-title">
          <h2 id="history-title" data-portal-i18n="history">Historial de clases</h2>
          <ul class="portal-list" id="portal-history"></ul>
          <p class="portal-note" id="empty-history" data-portal-i18n="emptyHistory" hidden></p>
        </section>
      </div>
      <div class="portal-stack">
        <section class="portal-panel" aria-labelledby="profile-title">
          <h2 id="profile-title" data-portal-i18n="profile">Mi perfil</h2>
          <dl class="portal-details" id="portal-profile"></dl>
        </section>
        <section class="portal-panel" aria-labelledby="purchases-title">
          <h2 id="purchases-title" data-portal-i18n="purchases">Mis compras</h2>
          <ul class="portal-list" id="portal-purchases"></ul>
          <p class="portal-note" id="empty-purchases" data-portal-i18n="emptyPurchases" hidden></p>
        </section>
      </div>
    </div>
  </div>
  <noscript><p class="portal-status">Activa JavaScript para acceder a tu espacio privado.</p></noscript>
</main>
</body>
</html>
